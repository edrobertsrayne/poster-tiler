<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Tiler</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { margin: 1rem 0; }
  #preview { max-width: 100%; border: 1px solid #999; display: block; margin-top: 1rem; }
  #sheetInfo { white-space: pre-wrap; margin-top: 1rem; }
  .error { color: #a00; }
  .warning { color: #905400; }
</style>
</head>
<body>
<h1>Poster Tiler</h1>

<input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/avif">

<fieldset>
  <legend>Paper size</legend>
  <label><input type="radio" name="paper" value="A4" checked> A4</label>
  <label><input type="radio" name="paper" value="A3"> A3</label>
</fieldset>

<fieldset>
  <legend>Orientation</legend>
  <label><input type="radio" name="orient" value="auto" checked> Auto</label>
  <label><input type="radio" name="orient" value="portrait"> Portrait</label>
  <label><input type="radio" name="orient" value="landscape"> Landscape</label>
</fieldset>
<fieldset>
  <legend>Output size</legend>
  <div>Print size: <span id="printSize">—</span></div>
  <label><input type="radio" name="sizemode" value="dpi" checked> DPI</label>
  <label><input type="radio" name="sizemode" value="custom"> Custom size</label>
  <div id="dpiRow">
    <label>DPI <select id="dpi">
      <option value="72" selected>72</option>
      <option value="100">100</option>
      <option value="150">150</option>
      <option value="200">200</option>
      <option value="300">300</option>
      <option value="custom">Custom…</option>
    </select></label>
    <input id="dpiCustom" type="number" min="10" max="1200" step="1" value="72" hidden>
  </div>
  <div id="customRow" hidden>
    <label>Width <input id="customW" type="number" min="0.1" step="0.1"></label>
    <span>×</span>
    <label>Height <input id="customH" type="number" min="0.1" step="0.1"></label>
    <select id="customUnit">
      <option value="in">in</option>
      <option value="cm" selected>cm</option>
    </select>
  </div>
</fieldset>
<fieldset>
  <legend>Options</legend>
  <label><input type="checkbox" id="mirror"> Mirror image horizontally</label>
</fieldset>

<canvas id="preview"></canvas>
<div id="sheetInfo"></div>
<button id="download" disabled>Download PDF</button>

<div id="guidance">
  <p>Print at 100% / Actual size — never Fit to page</p>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
